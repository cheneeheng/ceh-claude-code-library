name: model-audit

# Weekly (schedule currently disabled): audit plugins that are stale against Claude's per-model prompting guides and open a
# draft PR with the reports. See .claude/skills/model-audit/README.md. Nothing merges without review.
#
# Uses the Claude Code CLI, not anthropics/claude-code-action: audit.py fans out many headless
# `claude -p` runs, each with its own model, effort, and JSON output, which one action prompt cannot.
# The action also runs Claude through the Agent SDK and puts no `claude` on PATH for audit.py to call.
on:
  # Disabled for now: re-enable by uncommenting. Manual dispatch still works.
  # schedule:
  #   - cron: "0 6 * * 5" # Fridays 06:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the proposed edits on the audit branch
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

# Every run is billed: never let two overlap.
concurrency:
  group: model-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect stale plugins
        id: detect
        run: |
          python .claude/skills/model-audit/scripts/detect.py --write > "$RUNNER_TEMP/detect.json"
          cat "$RUNNER_TEMP/detect.json"
          echo "stale=$(jq '.stale | length' "$RUNNER_TEMP/detect.json")" >> "$GITHUB_OUTPUT"

      # Native installer: the npm package is deprecated. It installs to ~/.local/bin.
      - name: Install Claude Code
        if: steps.detect.outputs.stale != '0'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit
        id: audit
        if: steps.detect.outputs.stale != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Scheduled runs have no inputs, so they always apply. Edits land on audit/<date>, not main.
        run: python .claude/skills/model-audit/scripts/audit.py ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && '--apply' || '' }}

      # Runs even when the audit exits non-zero, so errors land in the PR for review.
      - name: Open draft PR
        if: ${{ !cancelled() && steps.detect.outputs.stale != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(date -u +%F)"
          branch="audit/$date"
          [ -f "audits/$date/SUMMARY.md" ] || { echo "No summary written"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .claude/skills/model-audit/assets/known-model-guides.json audits plugins
          git commit -m "chore(model-audit): audit reports for $date" \
            -m "Generated with [Claude Code](https://claude.com/claude-code) by CEH"
          git push -u origin "$branch"
          body="$RUNNER_TEMP/body.md"
          cp "audits/$date/SUMMARY.md" "$body"
          printf '\nGenerated with [Claude Code](https://claude.com/claude-code) by CEH\n' >> "$body"
          gh pr create --draft --base main --head "$branch" \
            --title "chore(model-audit): audit $date" --body-file "$body"
