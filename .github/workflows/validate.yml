name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # uv runs scripts/artifact.py, the plan/v2 check the artifact hook fixtures exercise.
      - uses: astral-sh/setup-uv@v6
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      - name: Validate plugins, skills, references, and scripts
        run: python tools/validate-plugins/validate.py
      # The mod tests (claude plugin test plugins/standalone/ceh-every-session) need Claude Code
      # on the runner, so they stay a local check.
      - name: Validator unit tests
        run: python -m unittest discover -s tools/validate-plugins/tests
      - name: Setup script unit tests
        run: python -m unittest tools/setup/test_setup.py
