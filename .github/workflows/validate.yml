name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      - name: Validate plugins, skills, references, and scripts
        run: python tools/validate-plugins/validate.py
