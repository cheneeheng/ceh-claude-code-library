name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/starlight/**"
      - "README.md"
      - "docs/GETTING_STARTED.md"
      - "docs/TESTING_WORKFLOW.md"
      - "docs/CATALOG.md"
      - "docs/ENVIRONMENT_VARIABLES.md"
      - "docs/PLUGIN_DEPENDENCIES.md"
      - "docs/PLUGIN_VERSIONS.md"
      - "plugins/standalone/*/README.md"
      - "plugins/standalone/*/.claude-plugin/plugin.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/starlight/package-lock.json
      - run: npm ci && npm run build
        working-directory: docs/starlight
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/starlight/dist
      - id: deployment
        uses: actions/deploy-pages@v4
