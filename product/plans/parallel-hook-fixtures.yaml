schema: plan/v2
title: Isolated parallel batches for hook fixtures
status: built
created: 2026-11-12
goal: Reduce the validator's hook bottleneck while executing every fixture and preserving stateful sequences.
scope:
  in:
    - Four bounded hook fixture batches with private temporary directories and error lists.
    - Stable fixture assignment by plugin or bare script name, preserving within-family order and original error numbering.
    - Focused isolation, coverage and failure-order tests plus paired full-validator timing and report comparison.
  out:
    - item: Hook implementation changes, skipped checks, caching or new dependencies
      reason: Improve the runner without reducing validation or changing plugin behavior.
    - item: Merge, push or changes in the original checkout
      reason: Other work remains in progress there.
design:
  - topic: Isolation
    decision: hooks.run_batch(batch, batches, bash) returns a list of (fixture index, location, message) triples and creates its own fixture tree and environment. Group fixtures by the first slash-separated script component, a plugin or bare script name. Assign groups round-robin to batches. Run every selected group's fixtures in original order, including repeats and callbacks. Only batch zero records common coverage and missing-uv errors, with index -1. No thread calls common.fail; the coordinator merges errors after workers finish.
  - topic: Concurrency
    decision: hooks.check uses ThreadPoolExecutor with at most four workers, bounded by CPU count, to overlap subprocess waits. Threads own no shared fixture state. Results sort by original fixture index before common.fail records them, preserving report order. Existing subprocess timeouts and exception propagation remain unchanged. The outer group process pool remains unchanged.
  - topic: Proof
    decision: Save the previous hook runner under ignored .agents_workspace/baseline-hooks/hooks.py. A paired benchmark runs the full validator before and after by changing the hook module import path only. Compare stdout and exit status, record timings and retain only a measured improvement. Focused tests prove each fixture runs once, same-family order, independent roots, failure ordering and repeat behavior.
phases:
  - name: Batch hook fixtures safely
    builds: Isolated threaded fixture batches, regression tests and runner documentation.
    check: python -m unittest discover -s tools/validate-plugins/tests -v and python .agents_workspace/compare-hook-batches.py
    status: done
    evidence: Nine focused tests passed. Paired full-validator benchmark confirmed the saved serial hook runner was imported by baseline workers. Before 76.85s, after 43.32s, identical passing reports and exit code 0, speedup 1.77x.
open: []
