    details: status ready. The user reviews it, so no review-build-plan run.
  - date: 2026-11-14
    event: PR
    details: "#294 https://github.com/cheneeheng/ceh-claude-code-library/pull/294"
  - date: 2026-11-14
    event: Reviewed
    details: |
      Revise first, 2 blocking (blog files saved beside a post on disk have no decided format; the
      shareable retro copy keeps `generated_from`, so the guard denies its scrub fixes)
