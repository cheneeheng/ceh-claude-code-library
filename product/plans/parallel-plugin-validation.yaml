schema: plan/v2
title: Git Bash selection and parallel plugin validation
status: built
created: 2026-11-12
goal: Run shell checks with Git Bash on Windows and overlap independent check groups without changing findings.
scope:
  in:
    - Shared Bash selection for hook and script checks, with local skips and CI failures when unavailable.
    - Bounded process pool for check groups, preserving report order and exit status.
    - Focused regression tests, documentation and sequential versus parallel comparison.
  out:
    - item: Changes in the original checkout, merge, push or plugin changes
      reason: The user requires isolation while other work continues.
    - item: Parallel hook fixtures or subprocess loops inside groups
      reason: Hook fixtures share state and group concurrency is the smallest first step.
design:
  - topic: Shell selection
    decision: common.find_bash() returns str or None. On Windows locate git.exe and probe bin/bash.exe and usr/bin/bash.exe relative to its installation. Never use Windows bash.exe. Else use shutil.which. common.check_bash() returns the resolved path and prints it, or prints a local skip or records a CI failure when missing. Both callers use that wrapper.
  - topic: Processes
    decision: validate.run_group(name) imports the group and returns its error list in a worker. main uses ProcessPoolExecutor with at most four workers and no more than CPU count or group count, and ordered map. Worker exceptions propagate. Keep global collectors isolated and hook fixtures sequential. Do not add a public jobs option.
  - topic: Validation
    decision: Use stdlib unittest and real spawned workers for isolation checks. Compare ordered findings and exit codes for a sequential and parallel full validator run on this worktree. Timings are observational, not a flaky test threshold.
phases:
  - name: Select Git Bash
    builds: Shared resolver, both callers, missing-shell behavior and resolver/hook regression checks.
    check: python -m unittest discover -s tools/validate-plugins/tests -v
    status: done
    evidence: Focused unittest suite passed 8 tests, including both real hook disable cases, custom Git installation, local skip and CI failure.
  - name: Parallelize groups
    builds: Bounded process pool, ordered results, process isolation tests, README and benchmark comparison.
    check: python -m unittest discover -s tools/validate-plugins/tests -v and python .agents_workspace/compare-validator.py, requiring identical reports and exit codes.
    status: done
    evidence: Focused unittest suite passed 8 tests. compare-validator.py reported identical reports and exit code 0, sequential 116.84s and parallel 74.47s, speedup 1.57x.
open: []
