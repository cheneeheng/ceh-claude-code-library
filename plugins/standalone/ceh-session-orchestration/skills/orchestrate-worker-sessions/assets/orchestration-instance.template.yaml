schema: orchestration-instance/v2
workers_started: <n>
workers:
  - name: <repo>-w<n>
    session_id: "<worker id>"
    reports_to: <orchestrator session name>
    model: <model | inherit>
    worktree: <worktree path | none>
    branch: <branch | none>
    status: <starting | busy | idle | closed | lost>
    started: "<YYYY-MM-DD HH:MM>"
    last_active: "<YYYY-MM-DD HH:MM>"
    tasks:
      - id: t<n>
        goal: <goal>
        scope: <scope>
        inputs:
          - <repo-relative path>
        done_when: <check>
        commit: <true | false>
        sent: "<YYYY-MM-DD HH:MM>"
        status: <sent | reported | accepted | rejected | answered>
        report:
          received: "<YYYY-MM-DD HH:MM>"
          status: <done | blocked | failed>
          summary: <summary>
          files:
            - <path>
          checks:
            - command: <command>
              result: <result>
          needs_user: <question | none>
held:
  - goal: <goal>
    scope: <scope>
    inputs:
      - <repo-relative path>
    done_when: <check>
    commit: <true | false>
    held: "<YYYY-MM-DD HH:MM>"
    model: <model>
    worker: <worker name>
    follows: true
