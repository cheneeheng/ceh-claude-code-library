schema: plan-review/v3
plan: .agents_workspace/product/plan/<file>.yaml
rounds:
  - date: YYYY-MM-DD
    verdict: <Ready to build | Revise first | Rethink>
    lenses:
      - <lens>
    skipped:
      - lens: <lens>
        reason: <reason>
    questions:
      - question: <question>
        recommended: <answer>
    unverified:
      - finding: <finding>
        why: <why unverified>
    fixes_made:
      - <edit made, or left open>
findings:
  - round: <n>
    lens: <lens>
    severity: <blocking | advisory>
    plan_line: <"quote">
    finding: <finding>
    fix: <fix>
    status: <open | fixed | won't fix>
    resolution: <resolution>
